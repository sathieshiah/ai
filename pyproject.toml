[project]
name = "research"
version = "0.1.0"
description = "Research on model weights, layers and activations"
requires-python = ">=3.13,<3.14"
# NOTE: torch is deliberately NOT listed here. PyPI ships no win_arm64 torch
# wheel; it must come from the PyTorch index. See README "Setup".
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "transformers",
    "safetensors",
    "tokenizers",
    "huggingface_hub",
    "accelerate",
    "einops",
    "gguf",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "jupyterlab",
    "ipykernel",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: downloads weights or reads large files"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# F401: `import research` is required for its side effect (it pins HF_HUB_CACHE),
#       and the template deliberately imports the toolkit before it is used.
# I001: import order in notebooks is semantically significant - `research` must
#       come first, so isort's grouping must not reorder it.
"notebooks/*.ipynb" = ["F401", "I001"]
