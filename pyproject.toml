[project]
name = "research"
version = "0.1.0"
description = "Research on model weights, layers and activations"
# 3.13 only: no torch wheel exists for cp314 on Windows ARM64, and the x64
# 3.13 on PATH runs under emulation. See docs/arm64-python-stack.md.
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch==2.9.1",
    "numpy",
    "pandas",
    "matplotlib",
    "transformers",
    "safetensors",
    "tokenizers",
    "huggingface_hub",
    "accelerate",
    "einops",
    "gguf",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "jupyterlab",
    "ipykernel",
    "nbformat",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# PyPI ships no win_arm64 torch wheel; the native build lives on the PyTorch
# index and stops at 2.9.1. `explicit = true` means this index is used *only*
# for the packages mapped to it below, so everything else still comes from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: downloads weights or reads large files"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# F401: `import research` is required for its side effect (it pins HF_HUB_CACHE),
#       and the template deliberately imports the toolkit before it is used.
# I001: import order in notebooks is semantically significant - `research` must
#       come first, so isort's grouping must not reorder it.
"notebooks/*.ipynb" = ["F401", "I001"]
